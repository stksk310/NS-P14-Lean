name: Inspect public Zenodo release status
on:
  push:
    branches: [diagnostics/zenodo-v1.0.0]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the public record search response
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error
          endpoints=[('search100','https://zenodo.org/api/records?'+urllib.parse.urlencode({'q':'"NS-P14-Lean"','size':100,'sort':'mostrecent'})),('record','https://zenodo.org/api/records/24280890')]
          for name,url in endpoints:
              req=urllib.request.Request(url,headers={'User-Agent':'NS-P14-Lean-release-verification/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=90) as response: data=json.load(response)
                  print(name,'OK','files_type',type(data.get('files')).__name__)
                  if name=='record':
                      print('record_summary',json.dumps({'doi':data.get('doi'),'metadata':data.get('metadata'),'links':data.get('links'),'files':data.get('files')},ensure_ascii=False))
                      file=data['files'][0];url=file['links']['self']
                      for kind,download in [('advertised',url),('encoded',url.replace('/files/stksk310/','/files/stksk310%2F'))]:
                          try:
                              req=urllib.request.Request(download,headers={'User-Agent':'NS-P14-Lean-release-verification/1.0','Range':'bytes=0-0'})
                              with urllib.request.urlopen(req,timeout=90) as response:
                                  print('file_probe',kind,response.status,dict(response.headers)); print('first_byte',response.read(1).hex())
                          except urllib.error.HTTPError as error: print('file_probe',kind,error.code,error.read(2000).decode(errors='replace'))
              except urllib.error.HTTPError as error:
                  print(name,'HTTP_STATUS',error.code,error.read(4000).decode(errors='replace'))
          PY
